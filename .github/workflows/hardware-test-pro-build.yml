            };
            await github.rest.repos.createOrUpdateFileContents({
              owner: owner,
              repo: repo,
              path: path,
              branch: branch,
              message: "Publish verified Hardware Test PRO " + version + " update",
              sha: old.data.sha,
              content: Buffer.from(JSON.stringify(manifest, null, 2) + "\n", "utf8").toString("base64")
            });
)
          if ($versionLines.Count -eq 0) { throw "Nie znaleziono wpisu VERSION w źródle aplikacji." }
          $lastVersionLine = $versionLines[$versionLines.Count - 1]
          $newVersionLine = 'VERSION = "' + $env:APP_VERSION + ' ' + $lastVersionLine.Groups["description"].Value + '"'
          $sourceText = $sourceText.Substring(0, $lastVersionLine.Index) + $newVersionLine + $sourceText.Substring($lastVersionLine.Index + $lastVersionLine.Length)
          [IO.File]::WriteAllText($sourcePath, $sourceText, [Text.UTF8Encoding]::new($false))
          $setupScriptPath = Join-Path (Get-Location) "SUITE_SETUP.iss"
          $setupScript = [IO.File]::ReadAllText($setupScriptPath, [Text.Encoding]::UTF8)
          $setupScript = [regex]::Replace($setupScript, '(?m)(#define AppVersion ")\d+\.\d+\.\d+(")', ('$1' + $env:APP_VERSION + '$2'))
          $setupScript = [regex]::Replace($setupScript, '(?m)(#define ExeName "NAPRAWA-PC-HARDWARE-TEST-PRO-)\d+\.\d+\.\d+(\.exe")', ('$1' + $env:APP_VERSION + '$2'))
          [IO.File]::WriteAllText($setupScriptPath, $setupScript, [Text.UTF8Encoding]::new($false))
          Write-Host "Źródło i instalator otrzymały wersję $env:APP_VERSION"

