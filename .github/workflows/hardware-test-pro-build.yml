      - name: Restore source and exact artwork
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}\hardware-test-pro"
          $assets = (Resolve-Path ".\assets").Path
          $items = @(
            @{ Prefix = "NaprawaPC_Hardware_Test_PRO_py"; Output = "NaprawaPC_Hardware_Test_PRO.pyw" },
            @{ Prefix = "ui_reference_png"; Output = "ui_reference.png" },
            @{ Prefix = "app_icon_png"; Output = "app_icon.png" },
            @{ Prefix = "app_ico"; Output = "app.ico" }
          )
          foreach ($item in $items) {
            $parts = @(Get-ChildItem -LiteralPath $assets -Filter "$($item.Prefix).*" | Where-Object { $_.Name -match '\.\d+\.b64\.txt$' } | Sort-Object { [int]([regex]::Match($_.Name, '\.(\d+)\.b64\.txt$').Groups[1].Value) })
            if ($parts.Count -eq 0) { throw "Missing asset chunks: $($item.Prefix)" }
            $joined = (($parts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join "")
            [IO.File]::WriteAllBytes((Join-Path (Get-Location) $item.Output), [Convert]::FromBase64String($joined))
          }
          if (!(Test-Path ".\NaprawaPC_Hardware_Test_PRO.pyw") -or !(Test-Path ".\ui_reference.png") -or !(Test-Path ".\app_icon.png") -or !(Test-Path ".\app.ico")) { throw "Source/artwork restoration failed." }

      - name: Prepare version, 125 themes and icon hover effects
        id: prepare
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}\hardware-test-pro"
          # The trigger commit may contain a stale manifest because the previous
          # successful release updates latest.json after the triggering commit was created.
          # Fetch the serialized mainline release state before calculating the next version.
          git fetch origin main --depth=1
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch latest main for version calculation." }
          $latestManifest = git show FETCH_HEAD:updates/hardware-test-pro/latest.json
          if ($LASTEXITCODE -ne 0 -or !$latestManifest) { throw "Cannot read latest stable manifest from current main." }
          $manifestPath = Join-Path "${{ github.workspace }}" "updates\hardware-test-pro\latest.json"
          [IO.File]::WriteAllText($manifestPath, (($latestManifest -join [Environment]::NewLine) + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          & ".\PREPARE_RELEASE.ps1"

