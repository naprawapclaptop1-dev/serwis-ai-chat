name: Hardware Test PRO — Windows build and UAC-safe updater release

on:
  push:
    branches: [main]
    paths:
      - "hardware-test-pro/**"
      - ".github/workflows/hardware-test-pro-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hardware-test-pro-global-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      APP_VERSION: "4.3.44"
      SETUP_FILENAME: "NAPRAWA-PC-HARDWARE-TEST-PRO-Setup-4.3.44.exe"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Restore source and exact artwork
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}\hardware-test-pro"
          $assets = (Resolve-Path ".\assets").Path
          $items = @(
            @{ Prefix = "NaprawaPC_Hardware_Test_PRO_py"; Output = "NaprawaPC_Hardware_Test_PRO.pyw" },
            @{ Prefix = "ui_reference_png"; Output = "ui_reference.png" },
            @{ Prefix = "app_icon_png"; Output = "app_icon.png" },
            @{ Prefix = "app_ico"; Output = "app.ico" }
          )
          foreach ($item in $items) {
            $parts = @(Get-ChildItem -LiteralPath $assets -Filter "$($item.Prefix).*" | Where-Object { $_.Name -match '\.\d+\.b64\.txt$' } | Sort-Object { [int]([regex]::Match($_.Name, '\.(\d+)\.b64\.txt$').Groups[1].Value) })
            if ($parts.Count -eq 0) { throw "Missing asset chunks: $($item.Prefix)" }
            $joined = (($parts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join "")
            [IO.File]::WriteAllBytes((Join-Path (Get-Location) $item.Output), [Convert]::FromBase64String($joined))
          }
          if (!(Test-Path ".\NaprawaPC_Hardware_Test_PRO.pyw") -or !(Test-Path ".\ui_reference.png") -or !(Test-Path ".\app_icon.png") -or !(Test-Path ".\app.ico")) { throw "Source/artwork restoration failed." }

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller psutil pillow numpy pygame-ce PyOpenGL sounddevice opencv-python

      - name: Syntax and built-in tests
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}\hardware-test-pro"
          python -m py_compile ".\NaprawaPC_Hardware_Test_PRO.pyw"
          python ".\NaprawaPC_Hardware_Test_PRO.pyw" --selftest-core
          python ".\NaprawaPC_Hardware_Test_PRO.pyw" --selftest-deep
          python ".\NaprawaPC_Hardware_Test_PRO.pyw" --selftest-update
          python ".\NaprawaPC_Hardware_Test_PRO.pyw" --selftest-launcher
          python ".\NaprawaPC_Hardware_Test_PRO.pyw" --selftest-antivirus
          python ".\NaprawaPC_Hardware_Test_PRO.pyw" --selftest-themes
          python ".\NaprawaPC_Hardware_Test_PRO.pyw" --selftest-update-flow

      - name: Build application EXE
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}\hardware-test-pro"
          python -m PyInstaller --noconfirm --clean --noconsole --onefile --name "NAPRAWA-PC-HARDWARE-TEST-PRO-4.3.44" --icon ".\app.ico" --add-data "ui_reference.png;." --add-data "app_icon.png;." --hidden-import psutil --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.ImageTk --hidden-import PIL.ImageOps --hidden-import numpy --hidden-import pygame --hidden-import OpenGL --hidden-import OpenGL.GL --hidden-import OpenGL.GLU --hidden-import sounddevice --hidden-import cv2 --collect-all PIL --collect-all numpy --collect-all pygame --collect-all OpenGL --collect-all sounddevice --collect-all cv2 ".\NaprawaPC_Hardware_Test_PRO.pyw"
          if (!(Test-Path ".\dist\NAPRAWA-PC-HARDWARE-TEST-PRO-4.3.44.exe")) { throw "PyInstaller did not create the EXE." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile and verify Setup.exe
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}\hardware-test-pro"
          $iscc = (Get-Command "ISCC.exe" -ErrorAction SilentlyContinue).Source
          $pf86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $pf = [Environment]::GetEnvironmentVariable("ProgramFiles")
          if (!$iscc -and (Test-Path "$pf86\Inno Setup 6\ISCC.exe")) { $iscc = "$pf86\Inno Setup 6\ISCC.exe" }
          if (!$iscc -and (Test-Path "$pf\Inno Setup 6\ISCC.exe")) { $iscc = "$pf\Inno Setup 6\ISCC.exe" }
          if (!$iscc) { throw "ISCC.exe not found." }
          $dist = (Resolve-Path ".\dist").Path
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$dist" "/O$dist" ".\SUITE_SETUP.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = Join-Path $dist $env:SETUP_FILENAME
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -lt 1MB) { throw "Verified Setup.exe is missing or too small." }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $installer).Length
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $bundle = Join-Path $dist "NAPRAWA-PC-HARDWARE-TEST-PRO-ALL-IN-ONE-4.3.44.zip"
          if (Test-Path $bundle) { Remove-Item $bundle -Force }
          Compress-Archive -Path @($installer, (Join-Path $dist "NAPRAWA-PC-HARDWARE-TEST-PRO-4.3.44.exe"), ".\README_PL.txt", ".\app.ico") -DestinationPath $bundle -CompressionLevel Optimal
          if (!(Test-Path $bundle) -or (Get-Item $bundle).Length -lt 100MB) { throw "Pakiet All-in-One ZIP nie zawiera wymaganych plików lub jest niekompletny." }
          $bundleHash = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          $bundleSize = (Get-Item -LiteralPath $bundle).Length
          "BUNDLE_SHA256=$bundleHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUNDLE_SIZE=$bundleSize" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish release assets
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hardware-test-pro-v4.3.44
          target_commitish: main
          name: "NAPRAWA PC HARDWARE TEST PRO 4.3.44"
          body: |
            Wydanie Windows x64. Instalator został zbudowany po testach źródeł i sprawdzeniu pliku Setup.exe.
          files: |
            hardware-test-pro/dist/NAPRAWA-PC-HARDWARE-TEST-PRO-Setup-4.3.44.exe
            hardware-test-pro/dist/NAPRAWA-PC-HARDWARE-TEST-PRO-ALL-IN-ONE-4.3.44.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove obsolete separate portable ZIP from release
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "hardware-test-pro-v" + process.env.APP_VERSION;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag
            });
            for (const asset of release.assets) {
              if (asset.name === "NAPRAWA-PC-HARDWARE-TEST-PRO-PORTABLE-4.3.44.zip") {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
            }

      - name: Publish update manifest only after successful release
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          INSTALLER_SHA256: ${{ env.INSTALLER_SHA256 }}
          INSTALLER_SIZE: ${{ env.INSTALLER_SIZE }}
          SETUP_FILENAME: ${{ env.SETUP_FILENAME }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = "updates/hardware-test-pro/latest.json";
            const branch = "main";
            const old = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            const version = process.env.APP_VERSION;
            const manifest = {
              app: "NAPRAWA PC HARDWARE TEST PRO",
              channel: "stable",
              version: version,
              release_ready: true,
              filename: process.env.SETUP_FILENAME,
              download_url: "https://github.com/" + owner + "/" + repo + "/releases/download/hardware-test-pro-v" + version + "/" + process.env.SETUP_FILENAME,
              sha256: process.env.INSTALLER_SHA256,
              size: Number(process.env.INSTALLER_SIZE),
              minimum_supported_version: "4.3.39",
              notes: "Wydanie 4.3.44: 125 skórek graficznych (115 nowych), diagnostyka antywirusów i GPU/VRAM, postęp pobierania oraz uruchomienie instalatora z UAC i zamykanie poprzedniej wersji. Instalator Windows x64.",
              published_at: new Date().toISOString()
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner: owner,
              repo: repo,
              path: path,
              branch: branch,
              message: "Publish verified Hardware Test PRO " + version + " update",
              sha: old.data.sha,
              content: Buffer.from(JSON.stringify(manifest, null, 2) + "\n", "utf8").toString("base64")
            });
