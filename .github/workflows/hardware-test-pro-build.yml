name: Hardware Test PRO — Windows build and UAC-safe updater release

on:
  push:
    branches: [main]
    paths:
      - "hardware-test-pro/**"
  pull_request:
    paths:
      - "hardware-test-pro/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hardware-test-pro-global-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Set up .NET 10 for hardware sensor bridge
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build self-contained hardware sensor bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "${{ github.workspace }}\hardware-test-pro"
          $bridgeSource = Get-Content -LiteralPath ".\SensorBridge\Program.cs" -Raw
          foreach ($required in @(
            'IsBatteryEnabled\s*=\s*true',
            'IsPsuEnabled\s*=\s*true',
            'IsPowerMonitorEnabled\s*=\s*true',
            'hardwareId',
            'identifier',
            'valueAvailable'
          )) {
            if ($bridgeSource -notmatch $required) { throw "Sensor Bridge missing required sensor coverage marker: $required" }
          }
          Write-Host "SENSOR_BRIDGE_SENSOR_COVERAGE_OK: battery, PSU, power monitor and stable sensor identifiers"
          dotnet publish ".\SensorBridge\HardwareSensorBridge.csproj" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o ".\SensorBridge\publish"
          if ($LASTEXITCODE -ne 0) { throw "Hardware sensor bridge publish failed." }
          $bridge = ".\SensorBridge\publish\NAPRAWA-PC-HARDWARE-SENSOR-BRIDGE.exe"
          if (!(Test-Path -LiteralPath $bridge) -or (Get-Item -LiteralPath $bridge).Length -lt 1MB) { throw "Self-contained sensor bridge EXE is missing or incomplete." }

      - name: Restore source and exact artwork
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}\hardware-test-pro"
          $assets = (Resolve-Path ".\assets").Path
          $items = @(
            @{ Prefix = "NaprawaPC_Hardware_Test_PRO_py"; Output = "NaprawaPC_Hardware_Test_PRO.pyw" },
            @{ Prefix = "ui_reference_png"; Output = "ui_reference.png" },
            @{ Prefix = "app_icon_png"; Output = "app_icon.png" },
            @{ Prefix = "app_ico"; Output = "app.ico" }
          )
          foreach ($item in $items) {
            $parts = @(Get-ChildItem -LiteralPath $assets -Filter "$($item.Prefix).*" | Where-Object { $_.Name -match '\.\d+\.b64\.txt$' } | Sort-Object { [int]([regex]::Match($_.Name, '\.(\d+)\.b64\.txt$').Groups[1].Value) })
            if ($parts.Count -eq 0) { throw "Missing asset chunks: $($item.Prefix)" }
            $joined = (($parts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join "")
            [IO.File]::WriteAllBytes((Join-Path (Get-Location) $item.Output), [Convert]::FromBase64String($joined))
          }
          if (!(Test-Path ".\NaprawaPC_Hardware_Test_PRO.pyw") -or !(Test-Path ".\ui_reference.png") -or !(Test-Path ".\app_icon.png") -or !(Test-Path ".\app.ico")) { throw "Source/artwork restoration failed." }

      - name: Prepare version, 125 themes and icon hover effects
        id: prepare
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}\hardware-test-pro"
          & ".\PREPARE_RELEASE.ps1"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller psutil pillow numpy pygame-ce PyOpenGL sounddevice opencv-python cryptography pypdf

      - name: Syntax and built-in tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "${{ github.workspace }}\hardware-test-pro"
          # Parse the standalone local build script before shipping it.
          $localBuild = ".\BUILD_LOCAL.ps1"
          if (!(Test-Path -LiteralPath $localBuild)) { throw "BUILD_LOCAL.ps1 is missing." }
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $localBuild).Path, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "BUILD_LOCAL.ps1 has PowerShell syntax errors."
          }
          $localBat = [IO.File]::ReadAllText((Resolve-Path -LiteralPath ".\BUILD_WINDOWS.bat").Path)
          if ($localBat -match "4\.3\.44" -or $localBat -notmatch "BUILD_LOCAL\.ps1") {
            throw "BUILD_WINDOWS.bat must call the version-aware local builder and must not hard-code 4.3.44."
          }
          Write-Host "LOCAL_BUILD_SCRIPT_SYNTAX_OK"
          $program = ".\NaprawaPC_Hardware_Test_PRO.pyw"
          python -m py_compile $program
          if ($LASTEXITCODE -ne 0) { throw "Python syntax check failed with code $LASTEXITCODE" }
          # Catch common Tk lifecycle regressions without pretending to replace a physical-device test.
          $checks = @(
            "--selftest-core",
            "--selftest-deep",
            "--selftest-update",
            "--selftest-launcher",
            "--selftest-antivirus",
            "--selftest-themes",
            "--selftest-service-center",
            "--selftest-update-flow",
            "--selftest-advanced-modules"
          )
          foreach ($check in $checks) {
            Write-Host "RUNNING SELFTEST: $check"
            python $program $check
            if ($LASTEXITCODE -ne 0) { throw "Self-test $check failed with exit code $LASTEXITCODE" }
          }

      - name: Build application EXE
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}\hardware-test-pro"
          python -m PyInstaller --noconfirm --clean --noconsole --onefile --name "NAPRAWA-PC-HARDWARE-TEST-PRO-$env:APP_VERSION" --icon ".\app.ico" --add-data "ui_reference.png;." --add-data "app_icon.png;." --add-binary "SensorBridge\publish\NAPRAWA-PC-HARDWARE-SENSOR-BRIDGE.exe;." --hidden-import psutil --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.ImageTk --hidden-import PIL.ImageOps --hidden-import numpy --hidden-import pygame --hidden-import OpenGL --hidden-import OpenGL.GL --hidden-import OpenGL.GLU --hidden-import sounddevice --hidden-import cv2 --collect-all PIL --collect-all numpy --collect-all pygame --collect-all OpenGL --collect-all sounddevice --collect-all cv2 --collect-all cryptography --hidden-import cryptography.fernet --hidden-import cryptography.hazmat.primitives.kdf.pbkdf2 --hidden-import pypdf ".\NaprawaPC_Hardware_Test_PRO.pyw"
          if (!(Test-Path ".\dist\NAPRAWA-PC-HARDWARE-TEST-PRO-$env:APP_VERSION.exe")) { throw "PyInstaller did not create the EXE." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile and verify Setup.exe
        id: installer
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}\hardware-test-pro"
          $iscc = (Get-Command "ISCC.exe" -ErrorAction SilentlyContinue).Source
          $pf86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $pf = [Environment]::GetEnvironmentVariable("ProgramFiles")
          if (!$iscc -and (Test-Path "$pf86\Inno Setup 6\ISCC.exe")) { $iscc = "$pf86\Inno Setup 6\ISCC.exe" }
          if (!$iscc -and (Test-Path "$pf\Inno Setup 6\ISCC.exe")) { $iscc = "$pf\Inno Setup 6\ISCC.exe" }
          if (!$iscc) { throw "ISCC.exe not found." }
          $dist = (Resolve-Path ".\dist").Path
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$dist" "/O$dist" ".\SUITE_SETUP.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = Join-Path $dist $env:SETUP_FILENAME
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -lt 1MB) { throw "Verified Setup.exe is missing or too small." }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $installer).Length
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_SIZE=$size" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $bundle = Join-Path $dist "NAPRAWA-PC-HARDWARE-TEST-PRO-ALL-IN-ONE-$env:APP_VERSION.zip"
          if (Test-Path $bundle) { Remove-Item $bundle -Force }
          Compress-Archive -Path @($installer, (Join-Path $dist "NAPRAWA-PC-HARDWARE-TEST-PRO-$env:APP_VERSION.exe"), ".\README_PL.txt", ".\app.ico", ".\NaprawaPC_Hardware_Test_PRO.pyw") -DestinationPath $bundle -CompressionLevel Optimal
          if (!(Test-Path $bundle) -or (Get-Item $bundle).Length -lt 100MB) { throw "Pakiet All-in-One ZIP nie zawiera wymaganych plików lub jest niekompletny." }
          $bundleHash = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          $bundleSize = (Get-Item -LiteralPath $bundle).Length
          "BUNDLE_SHA256=$bundleHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUNDLE_SIZE=$bundleSize" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish release assets
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hardware-test-pro-v${{ steps.prepare.outputs.app_version }}
          target_commitish: main
          name: "NAPRAWA PC HARDWARE TEST PRO ${{ steps.prepare.outputs.app_version }}"
          body: |
            Wydanie Windows x64.
            - 110 indywidualnych testów w 15 grupach i 110 unikalnych ID scen OpenGL.
            - 40 odczytowych diagnostyk SYSTEM REPAIR PRO / SERWIS ULTIMATE: po 20 na aplikację w katalogu integracyjnym.
            - Wszystkie 110 scen używają dedykowanego renderera: 90 scen w 9 rodzinach geometrii po 10 wariantów oraz 20 dodatkowych układów serwisowych; rzeczywiste FPS mierzone z synchronizacją renderowania.
            - Sensor Bridge zachowuje wykryte sensory bez bieżącej wartości jako N/D oraz oddziela liczbę wykrytych sensorów od liczby bieżących odczytów.
            - Speed Test: STANDARD dodaje 2 równoległe strumienie HTTPS; MAX/TURBO dodają 4; wynik równoległy jest oddzielony od mediany bazowej, a większy transfer wymaga potwierdzenia.
            - Serwis Ultimate: zlecenia serwisowe z lokalną historią/HTML, 7 testów zasilania/baterii, menedżer procesów z ochroną procesów krytycznych, odczytowa diagnostyka gier oraz menedżer lokalnych raportów z filtrem/CSV.
            - System Repair PRO: lokalna baza wiedzy z importem TXT/MD/PDF, SHA-256 i wyszukiwaniem źródeł; skrypty są tylko tekstem.
            - System Repair PRO: 14 profili problemów z odczytowymi skanami PowerShell, skrótami do narzędzi Windows, analizą błędu i raportem HTML.
            - 125 motywów UI, indywidualne raporty i aktualizator HTTPS.
            - Brak czujnika jest oznaczany N/D. Windows CI nie zastępuje testu fizycznego komputera użytkownika.
            - Uwaga dotycząca zakresu: 40 sond to integracja diagnostyczna w katalogu; pełna zgodność 1:1 wszystkich wewnętrznych ekranów i funkcji z obydwoma archiwami źródłowymi nie została jeszcze potwierdzona.
          files: |
            hardware-test-pro/dist/${{ steps.prepare.outputs.setup_filename }}
            hardware-test-pro/dist/NAPRAWA-PC-HARDWARE-TEST-PRO-ALL-IN-ONE-${{ steps.prepare.outputs.app_version }}.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove obsolete separate portable ZIP from release
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          APP_VERSION: ${{ steps.prepare.outputs.app_version }}
        with:
          script: |
            const tag = "hardware-test-pro-v" + process.env.APP_VERSION;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag
            });
            for (const asset of release.assets) {
              if (asset.name === "NAPRAWA-PC-HARDWARE-TEST-PRO-PORTABLE-" + process.env.APP_VERSION + ".zip") {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
            }

      - name: Publish update manifest only after successful release
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          APP_VERSION: ${{ steps.prepare.outputs.app_version }}
          INSTALLER_SHA256: ${{ steps.installer.outputs.sha256 }}
          INSTALLER_SIZE: ${{ steps.installer.outputs.size }}
          SETUP_FILENAME: ${{ steps.prepare.outputs.setup_filename }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = "updates/hardware-test-pro/latest.json";
            const branch = "main";
            const old = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            const version = process.env.APP_VERSION;
            const manifest = {
              app: "NAPRAWA PC HARDWARE TEST PRO",
              channel: "stable",
              version: version,
              release_ready: true,
              // The stable updater downloads the Setup installer directly; no helper EXE is distributed.
              filename: process.env.SETUP_FILENAME,
              download_url: "https://github.com/" + owner + "/" + repo + "/releases/download/hardware-test-pro-v" + version + "/" + process.env.SETUP_FILENAME,
              sha256: process.env.INSTALLER_SHA256,
              size: Number(process.env.INSTALLER_SIZE),
              installer_filename: process.env.SETUP_FILENAME,
              installer_download_url: "https://github.com/" + owner + "/" + repo + "/releases/download/hardware-test-pro-v" + version + "/" + process.env.SETUP_FILENAME,
              installer_sha256: process.env.INSTALLER_SHA256,
              installer_size: Number(process.env.INSTALLER_SIZE),
              minimum_supported_version: "4.3.39",
              notes: "Wydanie " + version + ": 110 odrębnych testów w 15 grupach, 110 unikalnych layoutów scen OpenGL, 40 odczytowych diagnostyk System Repair PRO / Serwis Ultimate, pełniejsza tabela sensorów z N/D, Speed Test STANDARD z 2 równoległymi strumieniami oraz MAX/TURBO z 4 strumieniami HTTPS, zlecenia serwisowe HTML, 7 testów zasilania/baterii, menedżer procesów, diagnostyka gier, menedżer raportów, lokalna baza wiedzy PDF/TXT/MD oraz 14 profili problemów System Repair PRO. Centrum napraw Windows, prywatne szyfrowane zgłoszenia oraz aktualizator HTTPS ze sprawdzaniem SHA-256/UAC. Windows x64. Pełna zgodność 1:1 wszystkich funkcji z archiwami źródłowymi nie jest deklarowana, dopóki nie przejdzie osobnego przeglądu.",
              published_at: new Date().toISOString()
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner: owner,
              repo: repo,
              path: path,
              branch: branch,
              message: "Publish verified Hardware Test PRO " + version + " update",
              sha: old.data.sha,
              content: Buffer.from(JSON.stringify(manifest, null, 2) + "\n", "utf8").toString("base64")
            });

