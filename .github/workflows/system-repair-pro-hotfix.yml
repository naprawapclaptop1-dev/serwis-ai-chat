name: System Repair PRO 5.6.15 — WPF startup hotfix

on:
  push:
    branches: [main]
    paths:
      - "system-repair-pro-hotfix-5.6.15/chunks/**"
      - ".github/workflows/system-repair-pro-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: system-repair-pro-hotfix-5-6-15
  cancel-in-progress: false

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore source ZIP from repository segments
        shell: pwsh
        run: |
          $chunkDir = Join-Path $env:GITHUB_WORKSPACE "system-repair-pro-hotfix-5.6.15\chunks"
          $parts = @(Get-ChildItem -LiteralPath $chunkDir -Filter "part_*.txt" | Sort-Object { [int]([regex]::Match($_.Name, 'part_(\d+)\.txt$').Groups[1].Value) })
          if ($parts.Count -ne 18) { throw "Expected 18 source archive chunks, found $($parts.Count)." }
          $encoded = (($parts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join "")
          $sourceZip = Join-Path $env:RUNNER_TEMP "SystemRepairPro-5.6.15-source.zip"
          [IO.File]::WriteAllBytes($sourceZip, [Convert]::FromBase64String($encoded))
          $extractDir = Join-Path $env:RUNNER_TEMP "SystemRepairPro-5.6.15-source"
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $extractDir -Force
          $source = Join-Path $extractDir "NAPRAWA_PC_SYSTEM_REPAIR_PRO_5.6.15_STATIC_RESOURCE_STARTUP_FIX"
          $project = Join-Path $source "NAPRAWA_PC_SYSTEM_REPAIR_PRO_5.6.15_STATIC_RESOURCE_STARTUP_FIX.csproj"
          if (!(Test-Path $project)) { throw "Patched project file missing from source ZIP." }
          "SYSTEM_REPAIR_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SYSTEM_REPAIR_SOURCE_ZIP=$sourceZip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          $source = $env:SYSTEM_REPAIR_SOURCE
          $project = Join-Path $source "NAPRAWA_PC_SYSTEM_REPAIR_PRO_5.6.15_STATIC_RESOURCE_STARTUP_FIX.csproj"
          $publish = Join-Path $env:RUNNER_TEMP "SystemRepairPro-5.6.15-publish"
          dotnet publish $project -c Release -r win-x64 --self-contained true -o $publish -p:DebugType=None
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }
          $exe = Join-Path $publish "NAPRAWA-PC-SYSTEM-REPAIR-PRO.exe"
          if (!(Test-Path $exe)) { throw "Published EXE is missing." }
          Copy-Item -LiteralPath (Join-Path $source "naprawa-pc.ico") -Destination $publish -Force
          "SYSTEM_REPAIR_PUBLISH=$publish" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke-test WPF XAML resources
        shell: pwsh
        run: |
          $exe = Join-Path $env:SYSTEM_REPAIR_PUBLISH "NAPRAWA-PC-SYSTEM-REPAIR-PRO.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--xaml-smoke" -PassThru -WindowStyle Hidden
          if (!$proc.WaitForExit(30000)) {
            try { $proc.Kill() } catch {}
            throw "XAML smoke test timed out after 30 seconds."
          }
          if ($proc.ExitCode -ne 0) {
            $desktop = [Environment]::GetFolderPath("DesktopDirectory")
            $reportDir = Join-Path $desktop "NAPRAWA_PC_RAPORTY"
            if (Test-Path $reportDir) {
              Get-ChildItem $reportDir -Filter "CRASH_*.txt" | Sort-Object LastWriteTime -Descending | Select-Object -First 2 | Get-Content
            }
            throw "WPF startup smoke test failed with exit code $($proc.ExitCode)."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = (Get-Command "ISCC.exe" -ErrorAction SilentlyContinue).Source
          $pf86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $pf = [Environment]::GetEnvironmentVariable("ProgramFiles")
          if (!$iscc -and (Test-Path "$pf86\Inno Setup 6\ISCC.exe")) { $iscc = "$pf86\Inno Setup 6\ISCC.exe" }
          if (!$iscc -and (Test-Path "$pf\Inno Setup 6\ISCC.exe")) { $iscc = "$pf\Inno Setup 6\ISCC.exe" }
          if (!$iscc) { throw "ISCC.exe not found." }
          $source = $env:SYSTEM_REPAIR_SOURCE
          $publish = $env:SYSTEM_REPAIR_PUBLISH
          $installerDir = Join-Path $env:RUNNER_TEMP "SystemRepairPro-5.6.15-installer"
          New-Item -ItemType Directory -Path $installerDir -Force | Out-Null
          & $iscc "/DAppVersion=5.6.15" "/DSourceDir=$publish" "/O$installerDir" (Join-Path $source "setup.iss")
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = Join-Path $installerDir "NAPRAWA-PC-SYSTEM-REPAIR-PRO-Setup-5.6.15.exe"
          if (!(Test-Path $installer)) { throw "Installer was not created." }
          if ((Get-Item $installer).Length -lt 1MB) { throw "Installer is suspiciously small." }
          "SYSTEM_REPAIR_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build one All-in-One ZIP
        shell: pwsh
        run: |
          $source = $env:SYSTEM_REPAIR_SOURCE
          $publish = $env:SYSTEM_REPAIR_PUBLISH
          $installer = $env:SYSTEM_REPAIR_INSTALLER
          $stage = Join-Path $env:RUNNER_TEMP "SystemRepairPro-5.6.15-AllInOne"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath $installer -Destination $stage -Force
          Copy-Item -LiteralPath (Join-Path $publish "NAPRAWA-PC-SYSTEM-REPAIR-PRO.exe") -Destination $stage -Force
          Copy-Item -LiteralPath (Join-Path $source "README.md") -Destination $stage -Force
          Copy-Item -LiteralPath (Join-Path $source "CHANGELOG_5.6.15_STATIC_RESOURCE_STARTUP_FIX.txt") -Destination $stage -Force
          Copy-Item -LiteralPath $env:SYSTEM_REPAIR_SOURCE_ZIP -Destination $stage -Force
          $bundle = Join-Path $env:RUNNER_TEMP "NAPRAWA-PC-SYSTEM-REPAIR-PRO-ALL-IN-ONE-5.6.15.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $bundle -CompressionLevel Optimal
          if (!(Test-Path $bundle) -or (Get-Item $bundle).Length -lt 50MB) { throw "All-in-One ZIP was not created or is incomplete." }
          $hash = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          "SYSTEM_REPAIR_BUNDLE=$bundle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SYSTEM_REPAIR_BUNDLE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish one download ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: system-repair-pro-v5.6.15
          target_commitish: main
          name: "NAPRAWA PC SYSTEM REPAIR PRO 5.6.15 — STARTUP HOTFIX"
          body: |
            Jedna paczka All-in-One: instalator Setup.exe, wersja przenośna EXE, instrukcja i poprawione źródła.
            Przed publikacją przeprowadzono kompilację Windows x64 oraz próbę załadowania XAML zasobów aplikacji.
          files: ${{ env.SYSTEM_REPAIR_BUNDLE }}
          fail_on_unmatched_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
